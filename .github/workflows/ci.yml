name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Typecheck
        run: python -m mypy app scripts

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Smoke test CLI
        run: python -m app.cli generate --asset healthcare --scale 1 --seed 42 --expiry-days 30 --publish
